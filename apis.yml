name: Glintinc
description: 'Glint (Glint Inc), founded in 2013 and headquartered in Redwood City, California, built a
  people-success and employee-engagement platform centered on frequent pulse surveys, engagement analytics,
  and manager action-planning to help organizations measure and improve employee experience. LinkedIn
  acquired Glint in November 2018, and the product was subsequently folded into Microsoft Viva as Viva
  Glint. There is no standalone Glint developer portal or public API: the former glintinc.com domain now
  302-redirects to Microsoft''s Viva Glint community, and the offering is delivered and documented through
  Microsoft Viva. This profile is retained for network lineage as a Norwest Venture Partners portfolio
  company that was acquired rather than an independently operating API provider.'
